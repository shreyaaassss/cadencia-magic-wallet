version: "3.9"

# ─────────────────────────────────────────────────────────────
# Cadencia — Production (EC2 + RDS)
# Images pulled from ECR; RDS Postgres used instead of local DB
# Access: https://cadenciaa.duckdns.org  (frontend via Caddy)
#         http://<EC2_PUBLIC_IP>:8000    (backend API)
# ─────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: ${BACKEND_IMAGE:-315326805553.dkr.ecr.ap-south-1.amazonaws.com/cadencia-backend:latest}
    command: alembic upgrade head
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-315326805553.dkr.ecr.ap-south-1.amazonaws.com/cadencia-backend:latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      # Caddy is now the sole entry point (port 3000 not exposed to host),
      # so all cookies travel over HTTPS — Secure flag is safe to enable.
      - SECURE_COOKIES=true
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-315326805553.dkr.ecr.ap-south-1.amazonaws.com/cadencia-frontend:latest}
    restart: unless-stopped
    # Port 3000 is intentionally NOT exposed to the host — all traffic must flow
    # through Caddy (ports 80/443) so the browser receives a secure context.
    # window.crypto.subtle (required by WalletConnect) is only available on HTTPS.
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENABLE_MOCKS=false
      - NEXT_PUBLIC_ALGORAND_NETWORK=testnet
      - NEXT_PUBLIC_ALGOD_SERVER=https://testnet-api.4160.nodely.dev
      - NEXT_INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
    depends_on:
      backend:
        condition: service_healthy

  # ── Caddy (HTTPS reverse proxy) ───────────────────────────────
  # Automatically provisions a Let's Encrypt TLS cert for cadenciaa.duckdns.org.
  # Requires ports 80 + 443 open in the EC2 security group and the DuckDNS
  # hostname pointing to the EC2 public IP.
  # crypto.subtle (needed by WalletConnect) requires a secure context (HTTPS),
  # so this service is the fix for the wallet connection TypeError.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  redis_data:
  caddy_data:
  caddy_config:
