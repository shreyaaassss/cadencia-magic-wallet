name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" || pip install fastapi uvicorn pydantic sqlalchemy asyncpg alembic redis structlog py-algorand-sdk algokit-utils PyNaCl python-jose passlib bcrypt cryptography httpx prometheus-client prometheus-fastapi-instrumentator openai groq magic-admin python-dotenv aiosqlite pytest pytest-asyncio pytest-cov

      - name: Lint with Ruff
        run: pip install ruff && ruff check src/ --output-format=github

      - name: Run unit tests
        run: python -m pytest tests/unit/negotiation/test_negotiation_engine.py tests/unit/shared/test_x402_middleware.py tests/unit/settlement/test_escrow.py -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY: test-key
          JWT_PUBLIC_KEY: test-key
          LLM_PROVIDER: stub

      - name: Run negotiation engine E2E tests
        run: python -m pytest tests/e2e/test_negotiation_e2e.py -v --tb=short
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///test.db
          REDIS_URL: redis://localhost:6379/0
          LLM_PROVIDER: stub

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm install --no-save ts-node && npx jest --passWithNoTests --ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_ENABLE_MOCKS: "false"
          NEXT_PUBLIC_ALGORAND_NETWORK: testnet
          NEXT_PUBLIC_ALGOD_SERVER: https://testnet-api.4160.nodely.dev
          NEXT_PUBLIC_ALGORAND_NODE_URL: https://testnet-api.algonode.cloud
          NEXT_PUBLIC_X402_ENABLED: "true"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: cadencia-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ALGORAND_NODE_URL=https://testnet-api.algonode.cloud
            NEXT_PUBLIC_X402_ENABLED=true
          tags: cadencia-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
