name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy (Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: SSH into EC2, pull latest code, build & restart all services
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAGIC_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MAGIC_PUBLISHABLE_KEY,BACKEND_ENV_CONTENT
          command_timeout: 40m
          script: |
            set -e

            # ── Pull latest code ────────────────────────────────────────────
            cd ~/cadencia-magic-wallet
            git fetch origin main
            git reset --hard origin/main
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "Code updated to: $(git log --oneline -1)"

            # ── Sync deployment config to app directory ─────────────────────
            mkdir -p ~/app
            cp docker-compose.prod.yml ~/app/
            cp Caddyfile ~/app/
            # Write .env.production from the BACKEND_ENV GitHub secret
            printf '%s' "${BACKEND_ENV_CONTENT}" > ~/app/.env.production
            echo "Deployment config synced to ~/app"

            # ── Build backend image (--no-cache ensures code changes deploy) ──
            cd backend
            docker build \
              --no-cache \
              --platform linux/amd64 \
              --target production \
              --tag cadencia-backend:latest \
              --tag cadencia-backend:${SHORT_SHA} \
              .
            echo "Backend image built: cadencia-backend:latest"

            # ── Build frontend image ────────────────────────────────────────
            cd ../frontend
            docker build \
              --no-cache \
              --platform linux/amd64 \
              --build-arg NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY="${MAGIC_PUBLISHABLE_KEY}" \
              --build-arg NEXT_PUBLIC_ALGORAND_NETWORK=testnet \
              --build-arg NEXT_PUBLIC_ALGOD_SERVER=https://testnet-api.4160.nodely.dev \
              --build-arg NEXT_PUBLIC_ALGORAND_NODE_URL=https://testnet-api.algonode.cloud \
              --build-arg NEXT_PUBLIC_X402_ENABLED=true \
              --build-arg NEXT_PUBLIC_ENABLE_MOCKS=false \
              --tag cadencia-frontend:latest \
              --tag cadencia-frontend:${SHORT_SHA} \
              .
            echo "Frontend image built: cadencia-frontend:latest"

            # ── Restart all services via Docker Compose ─────────────────────
            cd ~/app
            BACKEND_IMAGE=cadencia-backend:latest \
            FRONTEND_IMAGE=cadencia-frontend:latest \
              docker compose -p app -f docker-compose.prod.yml up -d --remove-orphans
            echo "All services restarted."

            # ── Health check ────────────────────────────────────────────────
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-backend-1 2>/dev/null || echo "unknown")
              echo "  attempt $i/18: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy! Deploy complete."
                exit 0
              fi
              sleep 10
            done
            echo "WARNING: backend did not reach healthy state in 3m — check logs"
            docker logs app-backend-1 --tail 30
            exit 1
