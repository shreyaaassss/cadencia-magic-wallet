name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALGORAND_NODE_URL: https://testnet-api.algonode.cloud
          NEXT_PUBLIC_ALGOD_SERVER: https://testnet-api.4160.nodely.dev
          NEXT_PUBLIC_X402_ENABLED: 'true'
          NEXT_PUBLIC_ENABLE_MOCKS: 'false'
          NEXT_PUBLIC_ALGORAND_NETWORK: testnet
          NEXT_INTERNAL_BACKEND_URL: http://localhost:8000
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package artifacts
        run: |
          # -C frontend strips the leading "frontend/" so the archive root is
          # .next/standalone, .next/static, public, package.json
          tar -czf frontend-build.tar.gz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            package.json

          # -C backend strips the leading "backend/" so the archive root is
          # src/, main.py, pyproject.toml, alembic/, alembic.ini
          tar -czf backend-src.tar.gz \
            -C backend \
            src \
            main.py \
            pyproject.toml \
            alembic \
            alembic.ini

      # ── Provision EC2 (idempotent — safe to run on every deploy) ──────────
      - name: Provision EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          timeout: 300s
          script: |
            set -e
            mkdir -p /home/ec2-user/cadencia/{frontend,backend,logs}

            # ── Node.js 20 ─────────────────────────────────────────────────────
            if ! node --version 2>/dev/null | grep -qE "^v20"; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
              sudo dnf install -y nodejs
            fi

            # ── PM2 ────────────────────────────────────────────────────────────
            if ! command -v pm2 &>/dev/null; then
              sudo npm install -g pm2
              # Register PM2 with systemd so processes survive reboots
              sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ec2-user \
                --hp /home/ec2-user 2>/dev/null | grep "sudo env" | bash || true
            fi

            # ── Python 3.12 ────────────────────────────────────────────────────
            if ! command -v python3.12 &>/dev/null; then
              sudo dnf install -y python3.12 python3.12-devel 2>/dev/null || \
              sudo dnf install -y python3 python3-devel 2>/dev/null || true
            fi
            # Ensure pip is available
            python3.12 -m ensurepip --upgrade 2>/dev/null || \
              curl -sS https://bootstrap.pypa.io/get-pip.py | python3.12

            # ── Caddy (HTTPS reverse proxy) ────────────────────────────────────
            if ! command -v caddy &>/dev/null; then
              ARCH=$(uname -m)
              [ "$ARCH" = "aarch64" ] && CADDY_ARCH="arm64" || CADDY_ARCH="amd64"
              curl -sSLf \
                "https://github.com/caddyserver/caddy/releases/download/v2.9.1/caddy_2.9.1_linux_${CADDY_ARCH}.tar.gz" \
                | tar xz -C /tmp caddy
              sudo mv /tmp/caddy /usr/local/bin/caddy
              sudo chmod 755 /usr/local/bin/caddy
              # Allow caddy to bind ports 80/443 without root
              sudo setcap cap_net_bind_service=+ep /usr/local/bin/caddy
            fi

            # ── Caddyfile ──────────────────────────────────────────────────────
            sudo mkdir -p /etc/caddy /var/lib/caddy /var/log/caddy
            sudo tee /etc/caddy/Caddyfile > /dev/null << 'CADDYEOF'
            {
              email admin@cadencia.io
            }

            cadencia-magic-wallet.duckdns.org {
              reverse_proxy localhost:3000
            }
            CADDYEOF

            # ── Caddy systemd service ──────────────────────────────────────────
            sudo tee /etc/systemd/system/caddy.service > /dev/null << 'SVC'
            [Unit]
            Description=Caddy HTTPS server
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=ec2-user
            Group=ec2-user
            ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
            ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile
            Restart=on-failure
            RestartSec=5s
            LimitNOFILE=1048576

            [Install]
            WantedBy=multi-user.target
            SVC

            sudo systemctl daemon-reload
            sudo systemctl enable caddy
            sudo systemctl restart caddy

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: frontend-build.tar.gz
          target: /home/ec2-user/cadencia/frontend/

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: backend-src.tar.gz
          target: /home/ec2-user/cadencia/backend/

      # ── Deploy & restart ──────────────────────────────────────────────────
      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          MAGIC_SECRET_KEY: ${{ secrets.MAGIC_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: BACKEND_ENV,MAGIC_SECRET_KEY
          script_stop: true
          timeout: 600s
          script: |
            set -e
            APP_DIR="/home/ec2-user/cadencia"

            # ── Frontend ───────────────────────────────────────────────────────
            cd $APP_DIR/frontend
            tar -xzf frontend-build.tar.gz --overwrite
            rm -f frontend-build.tar.gz
            # Merge static assets into the standalone bundle
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public 2>/dev/null || true

            # ── Backend ────────────────────────────────────────────────────────
            cd $APP_DIR/backend
            tar -xzf backend-src.tar.gz --overwrite
            rm -f backend-src.tar.gz

            # Write .env (BACKEND_ENV holds the full env file content)
            printf '%s\n' "$BACKEND_ENV" > .env
            echo "MAGIC_SECRET_KEY=$MAGIC_SECRET_KEY" >> .env

            # Install Python dependencies
            python3.12 -m pip install -e ".[standard]" --quiet 2>/dev/null || \
              python3.12 -m pip install \
                fastapi uvicorn gunicorn pydantic pydantic-settings \
                sqlalchemy asyncpg alembic pgvector redis structlog \
                py-algorand-sdk algokit-utils PyNaCl \
                python-jose passlib bcrypt cryptography \
                httpx prometheus-client prometheus-fastapi-instrumentator \
                openai groq magic-admin python-dotenv --quiet

            # Run DB migrations
            python3.12 -m alembic upgrade head 2>/dev/null || true

            # ── PM2 ecosystem (always recreate to pick up env changes) ──────────
            cat > $APP_DIR/ecosystem.config.js << 'ECOSYSTEM'
            module.exports = {
              apps: [
                {
                  name: 'cadencia-frontend',
                  script: '/home/ec2-user/cadencia/frontend/.next/standalone/server.js',
                  interpreter: 'node',
                  env: {
                    NODE_ENV: 'production',
                    PORT: '3000',
                    HOSTNAME: '0.0.0.0',
                    NEXT_INTERNAL_BACKEND_URL: 'http://localhost:8000',
                  },
                  out_file: '/home/ec2-user/cadencia/logs/frontend-out.log',
                  error_file: '/home/ec2-user/cadencia/logs/frontend-err.log',
                  merge_logs: true,
                },
                {
                  name: 'cadencia-backend',
                  script: 'python3.12',
                  args: '-m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2',
                  cwd: '/home/ec2-user/cadencia/backend',
                  interpreter: 'none',
                  out_file: '/home/ec2-user/cadencia/logs/backend-out.log',
                  error_file: '/home/ec2-user/cadencia/logs/backend-err.log',
                  merge_logs: true,
                },
              ],
            };
            ECOSYSTEM

            # Delete existing processes and start fresh (ensures new env vars apply)
            pm2 delete cadencia-frontend 2>/dev/null || true
            pm2 delete cadencia-backend  2>/dev/null || true
            pm2 start $APP_DIR/ecosystem.config.js
            pm2 save

            # ── Reload Caddy config ────────────────────────────────────────────
            sudo systemctl reload-or-restart caddy

            echo "✓ Deploy complete → https://cadencia-magic-wallet.duckdns.org"
