name: Deploy to AWS

on:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALGORAND_NODE_URL: https://testnet-api.algonode.cloud
          NEXT_PUBLIC_ALGOD_SERVER: https://testnet-api.4160.nodely.dev
          NEXT_PUBLIC_X402_ENABLED: 'true'
          NEXT_PUBLIC_ENABLE_MOCKS: 'false'
          NEXT_PUBLIC_ALGORAND_NETWORK: testnet
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package artifacts
        run: |
          tar -czf frontend-build.tar.gz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            package.json

          tar -czf backend-src.tar.gz \
            backend/src \
            backend/main.py \
            backend/pyproject.toml \
            backend/alembic \
            backend/alembic.ini

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          timeout: 600s
          script: |
            set -e
            mkdir -p /home/ec2-user/cadencia/{frontend,backend,logs}

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: frontend-build.tar.gz
          target: /home/ec2-user/cadencia/frontend/

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: backend-src.tar.gz
          target: /home/ec2-user/cadencia/backend/

      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          MAGIC_SECRET_KEY: ${{ secrets.MAGIC_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: BACKEND_ENV,MAGIC_SECRET_KEY
          script_stop: true
          timeout: 600s
          script: |
            set -e
            APP_DIR="/home/ec2-user/cadencia"

            # ── Frontend ──────────────────────────────────────────────
            cd $APP_DIR/frontend
            tar -xzf frontend-build.tar.gz --overwrite
            rm -f frontend-build.tar.gz

            # Write frontend env
            cat > .env.production << 'ENVEOF'
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            ENVEOF

            # ── Backend ───────────────────────────────────────────────
            cd $APP_DIR/backend
            tar -xzf backend-src.tar.gz --overwrite
            rm -f backend-src.tar.gz

            # Write backend .env
            echo "$BACKEND_ENV" > .env
            echo "MAGIC_SECRET_KEY=$MAGIC_SECRET_KEY" >> .env

            # Install Python deps
            python3.12 -m pip install -e ".[standard]" --quiet 2>/dev/null || \
              python3.12 -m pip install \
                fastapi uvicorn gunicorn pydantic pydantic-settings \
                sqlalchemy asyncpg alembic pgvector redis structlog \
                py-algorand-sdk algokit-utils PyNaCl \
                python-jose passlib bcrypt cryptography \
                httpx prometheus-client prometheus-fastapi-instrumentator \
                openai groq magic-admin python-dotenv --quiet

            # ── PM2 ───────────────────────────────────────────────────
            # Frontend
            pm2 describe cadencia-frontend > /dev/null 2>&1 && \
              pm2 restart cadencia-frontend || \
              pm2 start "node $APP_DIR/frontend/standalone/server.js" \
                --name cadencia-frontend \
                --log $APP_DIR/logs/frontend.log \
                --env production

            # Backend
            pm2 describe cadencia-backend > /dev/null 2>&1 && \
              pm2 restart cadencia-backend || \
              pm2 start \
                "python3.12 -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2" \
                --name cadencia-backend \
                --cwd $APP_DIR/backend \
                --log $APP_DIR/logs/backend.log

            pm2 save

            echo "Deploy complete. Frontend: :3000  Backend: :8000"
