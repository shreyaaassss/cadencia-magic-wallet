name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: SSH into EC2, pull latest code, build & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 25m
          script: |
            set -e

            # ── Pull latest code ────────────────────────────────────────────
            cd ~/cadencia-magic-wallet
            git fetch origin main
            git reset --hard origin/main
            echo "Code updated to: $(git log --oneline -1)"

            # ── Build production Docker image ───────────────────────────────
            cd backend
            docker build \
              --platform linux/amd64 \
              --target production \
              --tag cadencia-backend:latest \
              --tag cadencia-backend:$(git -C .. rev-parse --short HEAD) \
              .
            echo "Image built: cadencia-backend:latest"

            # ── Restart backend via Docker Compose ──────────────────────────
            cd ~/app
            BACKEND_IMAGE=cadencia-backend:latest \
              docker compose -f docker-compose.prod.yml up -d backend

            # ── Health check ────────────────────────────────────────────────
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' app-backend-1 2>/dev/null || echo "unknown")
              echo "  attempt $i/12: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy! Deploy complete."
                exit 0
              fi
              sleep 5
            done
            echo "WARNING: backend did not reach healthy state in 60s — check logs"
            docker logs app-backend-1 --tail 20
            exit 1
