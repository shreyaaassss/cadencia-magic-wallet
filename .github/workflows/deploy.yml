name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MAGIC_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_ALGORAND_NODE_URL: https://testnet-api.algonode.cloud
          NEXT_PUBLIC_ALGOD_SERVER: https://testnet-api.4160.nodely.dev
          NEXT_PUBLIC_X402_ENABLED: 'true'
          NEXT_PUBLIC_ENABLE_MOCKS: 'false'
          NEXT_PUBLIC_ALGORAND_NETWORK: testnet
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package artifacts
        run: |
          tar -czf frontend-build.tar.gz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            package.json

          tar -czf backend-src.tar.gz \
            -C backend \
            src \
            main.py \
            pyproject.toml \
            alembic \
            alembic.ini

      # Create ecosystem.config.js locally — avoids SSH heredoc injection bug
      - name: Create PM2 ecosystem config
        run: |
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [
              {
                name: 'cadencia-frontend',
                script: '/home/ec2-user/cadencia/frontend/.next/standalone/server.js',
                interpreter: 'node',
                env: {
                  NODE_ENV: 'production',
                  PORT: '3000',
                  HOSTNAME: '0.0.0.0',
                  NEXT_INTERNAL_BACKEND_URL: 'http://localhost:8000',
                },
                out_file: '/home/ec2-user/cadencia/logs/frontend-out.log',
                error_file: '/home/ec2-user/cadencia/logs/frontend-err.log',
                merge_logs: true,
              },
              {
                name: 'cadencia-backend',
                script: 'python3.12',
                args: '-m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2',
                cwd: '/home/ec2-user/cadencia/backend',
                interpreter: 'none',
                out_file: '/home/ec2-user/cadencia/logs/backend-out.log',
                error_file: '/home/ec2-user/cadencia/logs/backend-err.log',
                merge_logs: true,
              },
            ],
          };
          EOF

      - name: Ensure deploy directories exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          timeout: 60s
          script: mkdir -p /home/ec2-user/cadencia/{frontend,backend,logs}

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: frontend-build.tar.gz
          target: /home/ec2-user/cadencia/frontend/

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: backend-src.tar.gz
          target: /home/ec2-user/cadencia/backend/

      - name: Upload PM2 ecosystem config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ecosystem.config.js
          target: /home/ec2-user/cadencia/

      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          MAGIC_SECRET_KEY: ${{ secrets.MAGIC_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: BACKEND_ENV,MAGIC_SECRET_KEY
          script_stop: true
          timeout: 600s
          script: |
            set -e
            APP_DIR="/home/ec2-user/cadencia"

            cd $APP_DIR/frontend
            tar -xzf frontend-build.tar.gz --overwrite
            rm -f frontend-build.tar.gz
            # Sync static assets into standalone bundle (nginx serves them directly)
            rm -rf .next/standalone/.next/static
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public 2>/dev/null || true
            # Allow nginx (runs as nginx user) to read these files
            chmod o+x $APP_DIR $APP_DIR/frontend $APP_DIR/frontend/.next
            find $APP_DIR/frontend/.next/standalone -type d -exec chmod o+x {} \;
            find $APP_DIR/frontend/.next/standalone -type f -exec chmod o+r {} \;
            # Update nginx to serve _next/static directly (idempotent)
            CONF=$(find /etc/nginx/conf.d/ -name '*.conf' | head -1)
            if ! grep -q '_next/static' "$CONF" 2>/dev/null; then
              sudo sed -i 's|location / {|location /_next/static/ {\n        alias '$APP_DIR'/frontend/.next/standalone/.next/static/;\n        expires 1y;\n        add_header Cache-Control "public, immutable";\n        access_log off;\n    }\n\n    location / {|' "$CONF"
              sudo nginx -t && sudo nginx -s reload
            fi

            cd $APP_DIR/backend
            tar -xzf backend-src.tar.gz --overwrite
            rm -f backend-src.tar.gz
            printf '%s\n' "$BACKEND_ENV" > .env
            printf 'MAGIC_SECRET_KEY=%s\n' "$MAGIC_SECRET_KEY" >> .env

            python3.12 -m pip install -e ".[standard]" --quiet 2>/dev/null || python3.12 -m pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg alembic pgvector redis structlog py-algorand-sdk algokit-utils PyNaCl python-jose passlib bcrypt cryptography httpx prometheus-client prometheus-fastapi-instrumentator openai groq magic-admin python-dotenv --quiet
            python3.12 -m alembic upgrade head 2>/dev/null || true

            pm2 delete cadencia-frontend 2>/dev/null || true
            pm2 delete cadencia-backend 2>/dev/null || true
            pm2 start $APP_DIR/ecosystem.config.js
            pm2 save
            echo "Deploy complete"
