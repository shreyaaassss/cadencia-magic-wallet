name: Debug Logs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Get logs and DB state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd ~/cadencia/backend
            set -a && source .env && set +a
            DB_URL=$(echo "$DATABASE_URL" | sed 's|postgresql+asyncpg://|postgresql://|')

            echo "=== SELLER COUNT ==="
            psql "$DB_URL" -c "SELECT COUNT(*) as sellers FROM enterprises WHERE trade_role = 'SELLER';" 2>&1

            echo "=== BUYER COUNT ==="
            psql "$DB_URL" -c "SELECT COUNT(*) as buyers FROM enterprises WHERE trade_role = 'BUYER';" 2>&1

            echo "=== CAPABILITY PROFILES ==="
            psql "$DB_URL" -c "SELECT cp.enterprise_id, e.name, cp.industry_vertical, cp.embedding_status, cp.last_embedded_at FROM capability_profiles cp JOIN enterprises e ON e.id = cp.enterprise_id;" 2>&1

            echo "=== CATALOGUE ITEMS ==="
            psql "$DB_URL" -c "SELECT enterprise_id, COUNT(*) as items FROM catalogue_items GROUP BY enterprise_id;" 2>&1

            echo "=== RFQS ==="
            psql "$DB_URL" -c "SELECT id, status, product_name, created_at FROM rfqs ORDER BY created_at DESC LIMIT 5;" 2>&1

            echo "=== MATCHES ==="
            psql "$DB_URL" -c "SELECT m.rfq_id, m.seller_enterprise_id, m.score, m.rank, e.name FROM matches m JOIN enterprises e ON e.id = m.seller_enterprise_id ORDER BY m.created_at DESC LIMIT 10;" 2>&1

            echo "=== EMBEDDING STATUS ==="
            psql "$DB_URL" -c "SELECT enterprise_id, embedding_status, embedding IS NOT NULL as has_embedding FROM capability_profiles;" 2>&1

            echo "=== LAST 30 BACKEND ERRORS ==="
            pm2 logs cadencia-backend --lines 50 --nostream 2>&1 | grep -i -E "error|exception|match|embed|rfq" | tail -30

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
