name: Debug Logs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check embeddings and matching
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd ~/cadencia/backend
            set -a && source .env && set +a
            DB_URL=$(echo "$DATABASE_URL" | sed 's|postgresql+asyncpg://|postgresql://|')

            echo "=== Seller embedding dimensions ==="
            psql "$DB_URL" -c "SELECT enterprise_id, vector_dims(embedding) as dims, embedding_status FROM capability_profiles WHERE embedding IS NOT NULL;"

            echo "=== RFQ embedding status ==="
            psql "$DB_URL" -c "SELECT id, vector_dims(embedding) as dims, status, embedding IS NULL as no_embed FROM rfqs;"

            echo "=== LLM_PROVIDER ==="
            grep "^LLM_PROVIDER=" .env

            echo "=== GEMINI_API_KEY set? ==="
            grep -c "^GEMINI_API_KEY=" .env

            echo "=== Backend match/embed logs ==="
            pm2 logs cadencia-backend --lines 300 --nostream 2>&1 | grep -i -E "match|embed|rfq_no|rfq_parse|vector|cosine|dim|fallback|hash_embed|gemini|openai" | tail -30

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
