name: Check Backend Logs

on:
  workflow_dispatch:

jobs:
  check-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Get backend error logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            echo "=== PM2 STATUS ==="
            pm2 status
            echo ""
            echo "=== LAST 50 BACKEND LOGS ==="
            pm2 logs cadencia-backend --lines 50 --nostream 2>&1
            echo ""
            echo "=== LAST 20 ERROR LINES ==="
            pm2 logs cadencia-backend --lines 100 --nostream 2>&1 | grep -i -E "error|exception|traceback|500|critical|failed" | tail -20

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
