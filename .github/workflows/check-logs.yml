name: Check Backend Logs

on:
  workflow_dispatch:

jobs:
  check-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Switch to OpenAI and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd ~/cadencia/backend

            echo "=== Updating LLM provider to OpenAI ==="
            # Set OPENAI_API_KEY
            if grep -q "^OPENAI_API_KEY=" .env; then
              sed -i 's|^OPENAI_API_KEY=.*|OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}|' .env
            else
              echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
            fi

            # Set LLM_PROVIDER to openai
            if grep -q "^LLM_PROVIDER=" .env; then
              sed -i 's|^LLM_PROVIDER=.*|LLM_PROVIDER=openai|' .env
            else
              echo "LLM_PROVIDER=openai" >> .env
            fi

            # Set LLM_MODEL to gpt-4o-mini (fast + cheap for parsing)
            if grep -q "^LLM_MODEL=" .env; then
              sed -i 's|^LLM_MODEL=.*|LLM_MODEL=gpt-4o-mini|' .env
            else
              echo "LLM_MODEL=gpt-4o-mini" >> .env
            fi

            echo "LLM_PROVIDER set to openai, model gpt-4o-mini"

            echo "=== Restarting backend ==="
            pm2 restart cadencia-backend
            sleep 10

            echo "=== Health check ==="
            HEALTH=$(curl -s http://localhost:8000/health 2>/dev/null | python3.12 -c 'import sys,json; d=json.load(sys.stdin)["data"]; print(f"overall={d[\"overall\"]}")' 2>/dev/null || echo "unknown")
            echo "Backend: $HEALTH"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
